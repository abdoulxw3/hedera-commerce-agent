<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HashPay — Payment-Gated Services on Hedera</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0f;color:#fff;font-family:'Segoe UI',sans-serif;min-height:100vh}
header{padding:20px 32px;border-bottom:1px solid #1a1a2e;display:flex;align-items:center;justify-content:space-between}
.logo{display:flex;align-items:center;gap:12px}
.logo h1{font-size:22px;background:linear-gradient(90deg,#8b5cf6,#06b6d4);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.logo span{background:#1a1a2e;color:#8b5cf6;font-size:11px;padding:4px 10px;border-radius:20px;border:1px solid #8b5cf6}
.wallet-btn{background:linear-gradient(90deg,#8b5cf6,#06b6d4);border:none;color:#fff;padding:10px 20px;border-radius:10px;font-size:14px;cursor:pointer;font-weight:600}
.wallet-connected{background:#1a1a2e;border:1px solid #8b5cf6;color:#8b5cf6;padding:10px 20px;border-radius:10px;font-size:13px}
.hero{text-align:center;padding:50px 20px 30px}
.hero h2{font-size:32px;font-weight:700;margin-bottom:10px}
.hero p{color:#888;font-size:15px;max-width:480px;margin:0 auto}
.services{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;padding:30px 32px 60px;max-width:1100px;margin:0 auto}
.card{background:#111120;border:1px solid #1a1a2e;border-radius:16px;padding:22px;transition:all 0.2s}
.card:hover{border-color:#8b5cf6;transform:translateY(-2px)}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
.card-icon{font-size:26px}
.card-cost{background:#1a1a2e;color:#06b6d4;font-size:12px;padding:4px 10px;border-radius:20px}
.card h3{font-size:15px;margin-bottom:5px}
.card p{color:#666;font-size:12px;margin-bottom:14px}
.card button{width:100%;background:linear-gradient(90deg,#8b5cf6,#06b6d4);border:none;color:#fff;padding:10px;border-radius:8px;font-size:13px;cursor:pointer;font-weight:600}
.card button:disabled{background:#2a2a2a;cursor:not-allowed;color:#555}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:100;align-items:center;justify-content:center}
.modal.open{display:flex}
.modal-box{background:#111120;border:1px solid #2a2a4e;border-radius:20px;padding:28px;width:90%;max-width:420px}
.modal-box h3{font-size:18px;margin-bottom:6px}
.cost-badge{display:inline-block;background:#1a1a2e;color:#06b6d4;font-size:12px;padding:4px 12px;border-radius:20px;margin-bottom:16px}
.step{background:#0d0d1f;border:1px solid #2a2a4e;border-radius:10px;padding:12px;margin-bottom:12px;font-size:12px;color:#888}
.step strong{color:#8b5cf6}
.modal-box input{width:100%;background:#1a1a2e;border:1px solid #2a2a4e;color:#fff;padding:11px;border-radius:10px;font-size:13px;margin-bottom:10px}
.modal-actions{display:flex;gap:10px;margin-top:4px}
.modal-actions button{flex:1;padding:11px;border-radius:10px;border:none;font-size:13px;cursor:pointer;font-weight:600}
.btn-cancel{background:#1a1a2e;color:#888}
.btn-pay{background:linear-gradient(90deg,#8b5cf6,#06b6d4);color:#fff}
.btn-pay:disabled{background:#2a2a2a;color:#555;cursor:not-allowed}
.result{margin-top:12px;background:#0d1f0d;border:1px solid #1a4a1a;border-radius:10px;padding:12px;font-size:12px;color:#4ade80;white-space:pre-wrap;display:none}
.result.error{background:#1f0d0d;border-color:#4a1a1a;color:#f87171}
.loading{text-align:center;color:#8b5cf6;font-size:12px;margin-top:10px;display:none}
.notify{position:fixed;bottom:24px;right:24px;background:#1a1a2e;border:1px solid #8b5cf6;color:#fff;padding:12px 20px;border-radius:12px;font-size:13px;z-index:200;display:none}
.extra-field{display:none;width:100%;background:#1a1a2e;border:1px solid #2a2a4e;color:#fff;padding:11px;border-radius:10px;font-size:13px;margin-bottom:10px}
</style>
</head>
<body>
<header>
  <div class="logo">
    <h1>⚡ HashPay</h1>
    <span>Hedera Testnet</span>
  </div>
  <button class="wallet-btn" id="walletBtn" onclick="connectWallet()">Connect Wallet</button>
</header>
<div class="hero">
  <h2>Payment-Gated Services</h2>
  <p>Connect your wallet, pay HBAR, and get instant access to Hedera-powered services.</p>
</div>
<div class="services" id="services"></div>
<div class="modal" id="modal">
  <div class="modal-box">
    <h3 id="modal-title"></h3>
    <span class="cost-badge" id="modal-cost"></span>
    <div class="step"><strong>How it works:</strong> Your wallet signs an HBAR transfer to HashPay. Once confirmed on-chain, the service executes automatically.</div>
    <input class="extra-field" id="modal-extra" type="text" placeholder=""/>
    <div class="loading" id="loading">⏳ Processing on Hedera...</div>
    <div class="result" id="result"></div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-pay" id="payBtn" onclick="submitAccess()">Sign & Pay</button>
    </div>
  </div>
</div>
<div class="notify" id="notify"></div>
<script>
const icons={'weather-api':'🌤️','market-data':'📊','ai-reports':'🤖','hcs-logger':'📝','token-creator':'🪙','nft-minter':'🖼️','defi-rates':'💹'};
const descs={'weather-api':'Get premium weather data','market-data':'Live market data feed','ai-reports':'AI-generated research reports','hcs-logger':'Store messages permanently on Hedera','token-creator':'Create your own HTS token','nft-minter':'Mint an NFT on Hedera','defi-rates':'Live DeFi rates from Hedera ecosystem'};
const extraFields={'hcs-logger':'Message to store on Hedera','token-creator':'Token name, symbol, supply (e.g. MyToken,MTK,1000)','nft-minter':'Collection name, symbol (e.g. MyNFT,MNFT)'};

let connectedAccount=null;
let currentService=null;

function showNotify(msg){
  const el=document.getElementById('notify');
  el.textContent=msg;el.style.display='block';
  setTimeout(()=>el.style.display='none',3000);
}

async function connectWallet(){
  const accountId=prompt('Enter your Hedera testnet account ID (e.g. 0.0.12345):');
  if(accountId&&accountId.match(/^0\.0\.\d+$/)){
    connectedAccount=accountId;
    const btn=document.getElementById('walletBtn');
    btn.className='wallet-connected';
    btn.textContent='✅ '+accountId;
    showNotify('Wallet connected: '+accountId);
    document.querySelectorAll('.card button').forEach(b=>b.disabled=false);
  } else if(accountId){
    showNotify('Invalid account ID format');
  }
}

fetch('/services').then(r=>r.json()).then(services=>{
  const c=document.getElementById('services');
  services.forEach(s=>{
    c.innerHTML+=`<div class="card">
      <div class="card-top"><span class="card-icon">${icons[s.id]||'⚙️'}</span><span class="card-cost">${s.cost}</span></div>
      <h3>${s.name}</h3><p>${descs[s.id]||''}</p>
      <button onclick="openModal('${s.id}','${s.name}','${s.cost}')" disabled>Pay & Access</button>
    </div>`;
  });
});

function openModal(id,name,cost){
  if(!connectedAccount){showNotify('Please connect your wallet first');return;}
  currentService=id;
  document.getElementById('modal-title').textContent=name;
  document.getElementById('modal-cost').textContent='Cost: '+cost;
  document.getElementById('result').style.display='none';
  document.getElementById('loading').style.display='none';
  const extraEl=document.getElementById('modal-extra');
  if(extraFields[id]){
    extraEl.style.display='block';
    extraEl.placeholder=extraFields[id];
    extraEl.value='';
  } else {
    extraEl.style.display='none';
    extraEl.value='';
  }
  document.getElementById('modal').classList.add('open');
}

function closeModal(){document.getElementById('modal').classList.remove('open');}

async function submitAccess(){
  const extra=document.getElementById('modal-extra').value.trim();
  document.getElementById('loading').style.display='block';
  document.getElementById('result').style.display='none';
  document.getElementById('payBtn').disabled=true;
  try{
    const res=await fetch('/access',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({serviceId:currentService,accountId:connectedAccount,extra})});
    const data=await res.json();
    const el=document.getElementById('result');
    el.style.display='block';
    el.className='result'+(res.ok?'':' error');
    el.textContent=res.ok?data.result:data.error;
  }catch(e){
    const el=document.getElementById('result');
    el.style.display='block';el.className='result error';el.textContent='Request failed: '+e.message;
  }
  document.getElementById('loading').style.display='none';
  document.getElementById('payBtn').disabled=false;
}
</script>
</body>
</html>
